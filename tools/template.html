<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}} · 블루오라 투자노트</title>
<meta name="description" content="{{SUMMARY}}">
<meta property="og:type" content="article">
<meta property="og:title" content="{{TITLE}}">
<meta property="og:description" content="{{SUMMARY}}">
<meta property="article:published_time" content="{{DATE}}">
<link rel="stylesheet" href="/assets/style.css">
<script>
(function(){var t=localStorage.getItem('theme');
if(!t)t=matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light';
document.documentElement.setAttribute('data-theme',t);})();
</script>
</head>
<body>

<header class="site-header"><div class="wrap">
  <a class="brand" href="/"><span class="brand-mark">B</span>블루오라 투자노트</a>
  <nav class="nav">
    <a href="/">홈</a>
    <a href="/rss.xml">RSS</a>
    <button class="theme-btn" id="themeBtn" aria-label="테마 전환">◐</button>
  </nav>
</div></header>

<main class="wrap article">
  <div class="article-head">
    <a class="back" href="/">← 목록으로</a>
    <h1>{{TITLE}}</h1>
    <p class="sub">{{TAGHTML}} &nbsp;{{DATE}}</p>
  </div>

  <article class="article-body">
{{BODY}}

    <div class="disclaimer">
      이 글은 개인적인 학습과 기록을 위한 것이며, 특정 종목의 매수·매도를 권유하지 않습니다.
      일정과 수치는 발표 시점에 변경될 수 있으므로 반드시 원문을 확인하시기 바랍니다.
      투자 판단과 그 결과에 대한 책임은 투자자 본인에게 있습니다.
    </div>
  </article>
</main>

<footer class="site-footer"><div class="wrap">
  <span>© 2026 bluaura</span>
  <span>본 블로그의 모든 글은 정보 제공 목적이며 투자 권유가 아닙니다.</span>
</div></footer>

<script>
var btn=document.getElementById('themeBtn');
btn&&btn.addEventListener('click',function(){
  var r=document.documentElement,n=r.getAttribute('data-theme')==='dark'?'light':'dark';
  r.setAttribute('data-theme',n);localStorage.setItem('theme',n);
});
</script>
</body>
</html>
