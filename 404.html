<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>페이지를 찾을 수 없습니다</title>
<link rel="stylesheet" href="/assets/style.css">
<script>
(function(){var t=localStorage.getItem('theme');
if(!t)t=matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light';
document.documentElement.setAttribute('data-theme',t);})();
</script>
</head>
<body>
<header class="site-header"><div class="wrap">
  <a class="brand" href="/"><span class="brand-mark">B</span>블루오라 투자노트</a>
</div></header>
<main class="wrap" style="padding:100px 20px;text-align:center">
  <h1 style="font-size:56px;margin:0 0 8px;letter-spacing:-.04em">404</h1>
  <p style="color:var(--text-dim);margin:0 0 26px">요청하신 페이지가 없습니다.</p>
  <a class="back" href="/">← 목록으로 돌아가기</a>
</main>
</body>
</html>
